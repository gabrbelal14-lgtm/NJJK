<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Success Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }
        .task-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left-width: 6px;
        }
        .task-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .task-card.completed {
            transform: scale(0.95);
            opacity: 0.7;
            background-color: #f1f5f9;
            border-left-color: #10b981 !important;
            text-decoration: line-through;
        }
        .category-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 12px;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .points-anim {
            animation: pop 0.3s ease-in-out;
        }
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-2xl mx-auto">
        <!-- Dashboard Header -->
        <header class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">My Daily Hero Path 🚀</h1>
            <p class="text-slate-500 font-medium">Small steps every day lead to big results!</p>
            
            <div class="grid grid-cols-2 gap-4 mt-8">
                <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                    <span class="block text-xs font-bold text-indigo-400 uppercase">Total XP</span>
                    <span id="totalPoints" class="text-3xl font-black text-indigo-600">0</span>
                </div>
                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                    <span class="block text-xs font-bold text-emerald-400 uppercase">Daily Progress</span>
                    <div class="flex items-center gap-3 mt-2">
                        <div class="flex-1 h-3 bg-emerald-200 rounded-full overflow-hidden">
                            <div id="progressBar" class="h-full bg-emerald-500 transition-all duration-700 w-0"></div>
                        </div>
                        <span id="progressPercent" class="text-sm font-bold text-emerald-700">0%</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Task Groups -->
        <div id="tasksList" class="space-y-4">
            <!-- Tasks injected here -->
        </div>

        <footer class="mt-12 text-center">
            <p class="text-slate-400 text-sm">"Success is not final, failure is not fatal: it is the courage to continue that counts."</p>
        </footer>
    </div>

    <script>
        const tasks = [
            { id: 1, time: "05:00 AM", title: "Fajr Prayer & Quran Reading", category: "Worship", points: 50, icon: "🌙", color: "#6366f1" },
            { id: 2, time: "06:30 AM", title: "Morning Athkar", category: "Worship", points: 30, icon: "✨", color: "#f59e0b" },
            { id: 3, time: "08:00 AM", title: "Math Deep Work Session", category: "Study", points: 45, icon: "📐", color: "#ec4899" },
            { id: 4, time: "10:30 AM", title: "English Vocabulary & Reading", category: "Study", points: 40, icon: "🌍", color: "#3b82f6" },
            { id: 5, time: "12:30 PM", title: "Dhuhr Prayer", category: "Worship", points: 25, icon: "☀️", color: "#6366f1" },
            { id: 6, time: "02:00 PM", title: "Lunch Break & Rest", category: "Health", points: 15, icon: "🍎", color: "#10b981" },
            { id: 7, time: "03:45 PM", title: "Asr Prayer", category: "Worship", points: 25, icon: "🌤️", color: "#6366f1" },
            { id: 8, time: "04:30 PM", title: "Math Exercises & Homework", category: "Study", points: 40, icon: "✏️", color: "#ec4899" },
            { id: 9, time: "06:15 PM", title: "Maghrib Prayer & Evening Athkar", category: "Worship", points: 40, icon: "🌆", color: "#f59e0b" },
            { id: 10, time: "07:30 PM", title: "Isha Prayer", category: "Worship", points: 25, icon: "🌌", color: "#6366f1" },
            { id: 11, time: "08:30 PM", title: "Review Today's Lessons", category: "Study", points: 30, icon: "📋", color: "#3b82f6" },
            { id: 12, time: "10:00 PM", title: "Sleep Early", category: "Health", points: 20, icon: "💤", color: "#10b981" }
        ];

        let score = 0;
        let completed = 0;

        function render() {
            const container = document.getElementById('tasksList');
            container.innerHTML = tasks.map(t => `
                <div class="task-card bg-white p-5 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer border border-slate-100" 
                     style="border-left-color: ${t.color}"
                     onclick="toggleTask(${t.id}, this, ${t.points})">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 flex items-center justify-center bg-slate-50 rounded-xl text-2xl">${t.icon}</div>
                        <div>
                            <h3 class="font-bold text-slate-800">${t.title}</h3>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">${t.time}</span>
                                <span class="category-tag bg-slate-100 text-slate-500" style="color: ${t.color}; background: ${t.color}15">${t.category}</span>
                            </div>
                        </div>
                    </div>
                    <div class="font-black text-slate-300">+${t.points}</div>
                </div>
            `).join('');
        }

        window.toggleTask = function(id, el, p) {
            if(el.classList.contains('completed')) return;
            
            el.classList.add('completed');
            score += p;
            completed++;
            
            // Stats update
            const totalScoreEl = document.getElementById('totalPoints');
            totalScoreEl.innerText = score;
            totalScoreEl.classList.add('points-anim');
            setTimeout(() => totalScoreEl.classList.remove('points-anim'), 3000);

            const percent = Math.round((completed / tasks.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').innerText = percent + '%';

            triggerConfetti();
        };

        function triggerConfetti() {
            for(let i=0; i<20; i++) {
                const div = document.createElement('div');
                div.className = 'confetti';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.top = '-10px';
                div.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
                div.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(div);
                
                const animation = div.animate([
                    { transform: `translate(0, 0) rotate(0)`, opacity: 1 },
                    { transform: `translate(${(Math.random()-0.5)*200}px, 100vh) rotate(720deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });
                
                animation.onfinish = () => div.remove();
            }
        }

        render();
    </script>
</body>
</html>
